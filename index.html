<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pong - munni-team</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Pong</h1>
    <canvas id="game" width="800" height="500"></canvas>
    <div class="scoreboard">
      <div id="playerScore">0</div>
      <div id="separator">:</div>
      <div id="computerScore">0</div>
    </div>
    <p class="controls">Controls: Move your mouse over the canvas or use Up/Down arrow keys to move the left paddle. Click the canvas to start/restart.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
